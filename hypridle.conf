# Idle daemon, started from hyprland.lua
# No logind here, so listeners run hyprlock directly instead of loginctl lock-session

# Lock after 10 minutes, same command as SUPER + X
listener {
    timeout    = 600
    on-timeout = pgrep -x hyprlock >/dev/null || hyprlock
}

# Screens off after 15 minutes, back on at the first key press or mouse move
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
