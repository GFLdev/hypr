# Lock screen, locked with SUPER + X (see hyprland.lua)
# Monochrome palette, same as hyprtoolkit.conf and the Hyprland borders,
# with the red from wallpapers/black_white_red.png as accent

$font   = Iosevka Nerd Font Mono Light
$bg     = rgb(050505)
$base   = rgba(111111cc)
$text   = rgb(c0c0c0)
$bright = rgb(ffffff)
$muted  = rgb(808080)
$border = rgb(404040)
$accent = rgb(ca1a1b)

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# Same curves as the Hyprland animations
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    animation = fadeIn,               1, 4, easeOutQuint
    animation = fadeOut,              1, 3, almostLinear
    animation = inputFieldColors,     1, 3, easeOutQuint
    animation = inputFieldDots,       1, 2, easeOutQuint
    animation = inputFieldFade,       1, 3, almostLinear
    animation = inputFieldWidth,      1, 3, easeOutQuint
}

# Same wallpapers as hyprpaper.conf, blurred and dimmed so the widgets stand out
background {
    monitor     = HDMI-A-1
    path        = ~/.config/hypr/wallpapers/black_white_red.png
    color       = $bg
    blur_size   = 5
    blur_passes = 3
    brightness  = 0.6
    vibrancy    = 0
    noise       = 0
}

background {
    monitor = DVI-D-1
    path    = ~/.config/hypr/wallpapers/all_black.jpg
    color   = $bg
}

background {
    monitor = eDP-1
    path    = ~/.config/hypr/wallpapers/all_black.jpg
    color   = $bg
}


# Primary monitor: widgets in the empty space left of the figure

label {
    monitor     = HDMI-A-1
    text        = $TIME
    color       = $bright
    font_size   = 96
    font_family = $font
    position    = 120, 110
    halign      = left
    valign      = center
}

label {
    monitor     = HDMI-A-1
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $text
    font_size   = 18
    font_family = $font
    position    = 126, 20
    halign      = left
    valign      = center
}

input-field {
    monitor = HDMI-A-1
    size    = 300, 44

    # Like a focused window: 2px red border, rounding 4, kitty-ish background
    outline_thickness = 2
    rounding          = 4
    outer_color       = $accent
    inner_color       = $base
    font_color        = $text
    check_color       = $muted
    fail_color        = $bright
    capslock_color    = $border

    font_family      = $font
    placeholder_text = <span foreground="##808080">$USER</span>
    fail_text        = <span foreground="##ffffff">$FAIL ($ATTEMPTS)</span>
    fade_on_empty    = false

    dots_size    = 0.25
    dots_spacing = 0.3
    dots_center  = false

    position = 126, -50
    halign   = left
    valign   = center
}


# Left monitor (rotated, 768x1366): just the clock, centered

label {
    monitor     = DVI-D-1
    text        = $TIME
    color       = $text
    font_size   = 72
    font_family = $font
    position    = 0, 40
    halign      = center
    valign      = center
}

label {
    monitor     = DVI-D-1
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $muted
    font_size   = 16
    font_family = $font
    position    = 0, -30
    halign      = center
    valign      = center
}


# Left monitor at the office (laptop panel, 1920x1200): same centered clock,
# plus the password field, since it's the only monitor when HDMI-A-1 is unplugged

label {
    monitor     = eDP-1
    text        = $TIME
    color       = $text
    font_size   = 72
    font_family = $font
    position    = 0, 40
    halign      = center
    valign      = center
}

label {
    monitor     = eDP-1
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $muted
    font_size   = 16
    font_family = $font
    position    = 0, -30
    halign      = center
    valign      = center
}

input-field {
    monitor = eDP-1
    size    = 300, 44

    # Same as the one on the primary monitor
    outline_thickness = 2
    rounding          = 4
    outer_color       = $accent
    inner_color       = $base
    font_color        = $text
    check_color       = $muted
    fail_color        = $bright
    capslock_color    = $border

    font_family      = $font
    placeholder_text = <span foreground="##808080">$USER</span>
    fail_text        = <span foreground="##ffffff">$FAIL ($ATTEMPTS)</span>
    fade_on_empty    = false

    dots_size    = 0.25
    dots_spacing = 0.3
    dots_center  = false

    position = 0, -100
    halign   = center
    valign   = center
}
