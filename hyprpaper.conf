# Left monitor (DVI-D, rotated)
wallpaper {
    monitor = DVI-D-1
    path = ~/.config/hypr/wallpapers/all_black.jpg
    fit_mode = cover
}

# Left monitor at the office (laptop panel)
wallpaper {
    monitor = eDP-1
    path = ~/.config/hypr/wallpapers/all_black.jpg
    fit_mode = cover
}

# Primary monitor
wallpaper {
    monitor = HDMI-A-1
    path = ~/.config/hypr/wallpapers/black_white_red.png
    fit_mode = cover
}

splash = false
ipc = true
