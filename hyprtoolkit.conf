# Theme for hyprtoolkit apps (hyprlauncher, etc.)
# Monochrome palette, same as dwm/dmenu, st and nvim,
# with the red from wallpapers/black_white_red.png as accent

# kitty background_opacity 0.8 (0xcc), blurred by Hyprland (see layer rules);
# link_text is kitty's url_color
background       = 0xcc050505
base             = 0xff111111
alternate_base   = 0xff1a1a1a
text             = 0xffc0c0c0
bright_text      = 0xffffffff
link_text        = 0xffa0a0a0
# hyprlauncher draws its border and divider with accent darkened by 20%
# (r,g,b * 0.8), so this is ca1a1b / 0.8: they come out as the Hyprland
# active border red. Buttons and checkboxes in other apps use it as is.
accent           = 0xfffc2122
accent_secondary = 0xff808080

# Hyprland decoration rounding
rounding_large = 4
rounding_small = 2

# Same font as kitty (Iosevka Nerd Font Mono Light)
font_family           = Iosevka Nerd Font Mono Light
font_family_monospace = Iosevka Nerd Font Mono Light
font_size       = 13
small_font_size = 11
h1_size         = 22
h2_size         = 18
h3_size         = 15

# ~/.icons/MonoIcons, also the GTK icon theme. Symlinked into ~/.local/share/icons,
# since hyprtoolkit doesn't search ~/.icons. MonoIcons has no app icons, so those
# come from icons/hicolor (symlinked per file into ~/.local/share/icons/hicolor).
icon_theme = MonoIcons
